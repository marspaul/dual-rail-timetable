name: 預抓時刻表進 KV

# 排程放這裡而不是 Cloudflare Cron Trigger：Workers 免費方案的 Cron 只有
# 10 ms CPU，光是 JSON.parse 一份 3.7 MB 的台鐵整日時刻表就遠遠超過。
# 詳見 docs/prefetch-architecture.md。

on:
  schedule:
    # 週日/週四 16:00 UTC = 台北週一/週五 00:00，間隔 4 天與 3 天。
    # 不用 '*/4'：那是「每月第 1,5,9… 日」，跨月時間隔會縮成 1~3 天。
    - cron: '0 16 * * 0,4'
  workflow_dispatch:         # 手動觸發，排程漏跑或要立即更新時用

# 抓 7 天但最長只隔 4 天，刻意讓兩次執行的涵蓋範圍重疊：
# 就算其中一次整個失敗，到下一次執行前都還有資料可用。
# GitHub 排程常誤點（實測遲到 4 小時 17 分），重疊也吸收掉這個誤差。

concurrency:
  group: prefetch-timetable
  cancel-in-progress: false

jobs:
  prefetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 抓取 TDX 並精簡編碼
        env:
          TDX_CLIENT_ID:     ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
          DAYS: '7'
          OUT:  ${{ runner.temp }}/kv-bulk.json
        run: node scripts/prefetch-timetable.mjs

      - name: 寫入 Cloudflare KV
        working-directory: cloudflare-worker
        env:
          CLOUDFLARE_API_TOKEN:  ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 kv bulk put --binding TOKEN_KV --remote "${{ runner.temp }}/kv-bulk.json"
